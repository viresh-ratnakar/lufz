function log(html, onlyConsole=false) {

`);

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src;
    script.type = 'text/javascript';
    script.async = true;
    script.onload = () => {
      script.remove();
      resolve(`Successfully loaded: ${src}`);
    };
    script.onerror = () => {
      script.remove();
      reject(new Error(`Failed to load script at: ${src}`));
    };
    document.head.appendChild(script);
  });
}

loadScript(lexFile)
  .then((message) => {
    log(message);
    createAndWriteStems();
  })
  .catch((error) => {
    alert('Could not load ' + lexFile + ': ' + error.message);
  });


function save(text, fileName) {
  const a = document.createElement('a');
  a.style.display = 'none';
  document.body.appendChild(a);
  a.href = window.URL.createObjectURL(
    new Blob([text], {type: 'text/plain'})
  );
  a.setAttribute('download', fileName);
  a.click();
  window.URL.revokeObjectURL(a.href);
  document.body.removeChild(a);
}

function getRegionalVariants() {
  const allVariants = {};
  
  for (const prop in regionalVariancePatterns) {
    const cls = regionalVariancePatterns[prop];
    allVariants[prop] = {
      regions: cls.regions,
      dontBanish: cls.dontBanish || null,
      pair_groups: []
    };
    for (let i = 1; i < 40; i++) {
      const prefix = '?'.repeat(i);
      const sfPair = cls.suffixes[0];
      const pattern1 = prefix + sfPair[0];
      const choices1 = exetLexicon.getLexChoices(pattern1);
      for (let x = 0; x < choices1.length; x++) {
        const id1 = choices1[x];
        const entry1 = exetLexicon.lexicon[id1];
        if (cls.re && !cls.re.test(entry1)) continue; 
        if (cls.notRe && cls.notRe.test(entry1)) continue; 
        const root = entry1.substr(0, i).toUpperCase();
        const pattern2 = root + sfPair[1];
        const choices2 = exetLexicon.getLexChoices(pattern2, 1);
        if (choices2.length != 1) continue;
        const id2 = choices2[0];
        const entry2 = exetLexicon.lexicon[id2];
        const variants = {
          ids: [[id1, id2]],
          entries: [[entry1, entry2]]
        };
        for (let j = 1; j < cls.suffixes.length; j++) {
          const sfPair = cls.suffixes[j];
          const pattern1 = root + sfPair[0];
          const choices1 = exetLexicon.getLexChoices(pattern1, 1);
          const id1 = (choices1.length == 1) ? choices1[0] : 0;
          const entry1 = exetLexicon.lexicon[id1];
          const pattern2 = root + sfPair[1];
          const choices2 = exetLexicon.getLexChoices(pattern2, 1);
          const id2 = (choices2.length == 1) ? choices2[0] : 0;
          const entry2 = exetLexicon.lexicon[id2];
          if (id1 == 0 && id2 == 0) continue;
          variants.ids.push([id1, id2]);
          variants.entries.push([entry1, entry2]);
        }
        allVariants[prop].pair_groups.push(variants);
      }
    }
  }
  for (const prop in regionalVarianceExtras) {
    const cls = regionalVarianceExtras[prop];
    allVariants[prop] = {
      regions: cls.regions,
      dontBanish: cls.dontBanish || null,
      pair_groups: []
    };
    for (const group of cls.groups) {
      const variants = {
        ids: [],
        entries: []
      };
      let num = 0;
      for (const pair of group) {
        const ids = [0, 0];
        for (let k = 0; k < 2; k++) {
          const pattern = pair[k].toUpperCase();
          const choices = exetLexicon.getLexChoices(pattern);
          for (const id of choices) {
            const entry = exetLexicon.getLex(id);
            if (entry == pair[k]) {
              ids[k] = id;
              break;
            }
          }
          if (ids[k] == 0) {
            log('Looking to map regional pair ' + JSON.stringify(pair) + ', there was no lexicon entry for: ' + pair[k], true);
            pair[k] = '';
          }
        }
        if (ids[0] == 0 && ids[1] == 0) {
          continue;
        }
        variants.ids.push(ids);
        variants.entries.push(pair);
        num++;
      }
      if (num > 0) {
        allVariants[prop].pair_groups.push(variants);
      }
    }
  }
  return allVariants;
}

function myStem(s) {
  const ls = s.toLowerCase();
  if (stemOverrides.hasOwnProperty(ls)) {
    return stemOverrides[ls];
  }
  return stem(s);
}

let stemGroups;
let n;
let stems;
let usbrca;

function getCycle(x) {
  console.assert(x >= 0 && x < n, x, n);
  const cycle = [x];
  let next = stemGroups[x];
  while (next != x) {
    cycle.push(next);
    next = stemGroups[next];
    console.assert(cycle.length < 1000, cycle.length, x);
  }
  cycle.sort((a, b) => a - b);
  return cycle;
}

function printCycle(cycle) {
  let res = '[';
  for (let i = 0; i < cycle.length; i++) {
    if (i > 0) res += ', ';
    res += exetLexicon.lexicon[cycle[i]];
  }
  return res + ']';
}

function mergeCycles(x1, x2, shouldLog='') {
  const cycle1 = getCycle(x1);
  console.assert(cycle1.length >= 1, cycle1.length);
  const cycle2 = getCycle(x2);
  console.assert(cycle2.length >= 1, cycle2.length);
  const cycleSet1 = new Set(cycle1);
  console.assert(cycleSet1.size == cycle1.length, cycleSet1.size, cycle1.length);
  const cycleSet2 = new Set(cycle2);
  console.assert(cycleSet2.size == cycle2.length, cycleSet2.size, cycle2.length);
  const areDisjoint = cycleSet1.isDisjointFrom(cycleSet2);
  const symdiff = cycleSet1.symmetricDifference(cycleSet2);
  if (!areDisjoint) {
    console.assert(cycleSet1.size == cycleSet2.size, cycleSet1.size, cycleSet2.size);
    console.assert(symdiff.size == 0, symdiff.size);
    return;
  }
  const union = cycleSet1.union(cycleSet2);
  const unionArray = [...union];
  unionArray.sort((a, b) => a - b);
  if (shouldLog) {
    console.log(shouldLog);
    console.log('  Merging ' + printCycle(cycle1) + ' and ' + printCycle(cycle2));
    console.log('  Merger: ' + printCycle(unionArray));
  }
  unionArray.push(unionArray[0]);
  for (let i = 1; i < unionArray.length; i++) {
    const from = unionArray[i - 1];
    const to = unionArray[i];
    stemGroups[from] = to;
  }
}

function makeRegionalSwapLists(regionalVariants) {
  log('makeRegionalSwapLists()...');
  const regions = {};
  for (const key in regionalVariants) {
    for (const r in regionalVariants[key].regions) {
      if (!regions.hasOwnProperty(r)) {
        regions[r] = {
          swaps: [],
          idToSwapIndex: new Map(),
          dontBanish: new Set(),
        };
      }
    }
  }
  for (const key in regionalVariants) {
    log('Processing regional key ' + key);
    const variant = regionalVariants[key];
    const groups = variant.pair_groups;
    for (const group of groups) {
      for (const idPair of group.ids) {
        const id1 = idPair[0];
        const id2 = idPair[1];
        if (id1 == 0 || id2 == 0) continue;
        const entries = [exetLexicon.getLex(id1), exetLexicon.getLex(id2)];
        console.assert(id1 != id2, id1, id2);
        const stemGroup1 = exetLexicon.stemGroup(id1);
        const stemGroup2 = exetLexicon.stemGroup(id2);
        console.assert(stemGroup1.length == stemGroup2.length &&
                       stemGroup1.length > 0 &&
                       stemGroup1[0] == stemGroup2[0],
                       entries[0], entries[1],
                       JSON.stringify(stemGroup1), JSON.stringify(stemGroup2)); 
        for (const r in variant.regions) {
          const x = variant.regions[r];
          console.assert(x == 0 || x == 1, x);
          const idToPrefer = idPair[x];
          const idToReplace = idPair[1 - x];
          console.assert(idToPrefer != idToReplace, idToPrefer, entries[x], idToReplace, entries[1 - x]);
          let skip = false;
          for (let k = 0; k < 2; k++) {
            if (regions[r].idToSwapIndex.has(idPair[k])) {
              const swapIndex = regions[r].idToSwapIndex.get(idPair[k]);
              const swap = regions[r].swaps[swapIndex];
              log('Skipping swap [' + exetLexicon.getLex(idToPrefer) + '<->' +
                  exetLexicon.getLex(idToReplace) + '] for region ' + r + ' as ' +
                  entries[k] + ' already has swap [' +
                  exetLexicon.getLex(swap[0]) + '<->' + exetLexicon.getLex(swap[1]) + ']', true);
              skip = true;
              break;
            }
          }
          if (skip) continue;
          const swapIndex = regions[r].swaps.length;
          regions[r].idToSwapIndex.set(idToPrefer, swapIndex);
          regions[r].idToSwapIndex.set(idToReplace, swapIndex);
          regions[r].swaps.push([idToPrefer, idToReplace]);
          const dontBanish = variant.dontBanish ? (variant.dontBanish[r] ?? false) : false;
          if ((Array.isArray(dontBanish) && dontBanish.includes(entries[1-x])) ||
              (!Array.isArray(dontBanish) && dontBanish)) {
            regions[r].dontBanish.add(idToReplace);
          }
        }
      }
    }
  }
  return regions;
}

/**
 * TODO: add exetLexicon region-changing code. Note that applying a list of
 *       swaps twice should restore the original state.
 * Algo:
 * 1. Create stems, add to exetLexicon object, call initExetLexicon().
 * 2. Populate regional-variants pairs.
 * 3. For each pair of words in a regional group, (not just matching pairs)
 *    merge stem groups.
 * 4. For each entry of 6+ length, merge stem groups with all words that have it
 *    as a prefix.
 * 5. Create per-region swap lists. For each region, remember any id that's
 *    already in a swap and do not reuse it (to avoid weird corner cases
 *    like two brit-versions mapping to the same US-version). Only include
 *    a swap pair if we're preferring the higher-lexicon-index version.
 *    When adding a swap pair, doublecheck via an assert that they are in the
 *    same stem group.
 * 6. Output the updated exetLexicon.stems and exetLexicon.regions.
 */
function createAndWriteStems() {

  n = exetLexicon.lexicon.length;
  log('The lexicon has ' + n + ' entries');

  stems = {};
  usbrca = [];

  const lexIndex = {};
  for (let i = 0; i < n; i++) {
    const w = exetLexicon.lexicon[i];
    lexIndex[w] = i;
  }

  const FIRST_AS_STEM_IN_MULTIWORD = 4;
  let index = -1;
  for (let w of exetLexicon.lexicon) {
    index += 1;
    const blankPos = w.indexOf(' ');
    const dashPos = w.indexOf('-');
    const quotePos = w.indexOf("'");
    /* the smallest of the 3 will get used */
    if (blankPos > FIRST_AS_STEM_IN_MULTIWORD) {
      w = w.substr(0, blankPos);
    }
    if (dashPos > FIRST_AS_STEM_IN_MULTIWORD) {
      w = w.substr(0, dashPos);
    }
    if (quotePos > FIRST_AS_STEM_IN_MULTIWORD) {
      w = w.substr(0, quotePos);
    }
    const s = myStem(w);

    if (!stems.hasOwnProperty(s)) {
      stems[s] = [];
    }
    stems[s].push(index);
  }

  log('Populated stems, creating groups...');

  stemGroups = Array(n);
  for (let i = 0; i < n; i++) {
    stemGroups[i] = i;
  }

  for (const s in stems) {
    const group = stems[s];
    if (group.length <= 1) continue;
    group.push(group[0]);
    for (let i = 1; i < group.length; i++) {
      const from = group[i - 1];
      const to = group[i];
      console.assert(stemGroups[from] == from, from, stemGroups[from]);
      stemGroups[from] = to;
    }
  }

  log('Testing that every lexicon index returns a valid cycle');
  let longestCycle = 0;
  for (let i = 0; i < n; i++) {
    const cycle = getCycle(i);
    console.assert(cycle.length >= 1, i);
    if (cycle.length > longestCycle) {
      longestCycle = cycle.length;
      log('longest cycle ' + printCycle(cycle) + ': ' + longestCycle, true);
    }
  }

  exetLexicon.stems = stemGroups;
  exetLexicon.stemsId = exetLexicon.id;
  exetLexiconInit();

  log('Creating regional variants...');
  const regionalVariants = getRegionalVariants();

  log('Merging regional variant stem groups...');
  for (const key in regionalVariants) {
    const groups = regionalVariants[key].pair_groups;
    for (const group of groups) {
      const idsSet = new Set();
      for (const idPair of group.ids) {
        if (idPair[0] > 0) idsSet.add(idPair[0]);
        if (idPair[1] > 0) idsSet.add(idPair[1]);
      }
      const idsSetArray = [...idsSet];
      for (let x1 = 0; x1 < idsSetArray.length; x1++) {
        const id1 = idsSetArray[x1];
        for (let x2 = x1 + 1; x2 < idsSetArray.length; x2++) {
          const id2 = idsSetArray[x2];
          mergeCycles(id1, id2);
        }
      }
    }
  }

  /**
   * Reminder to self: "5+" woould be too aggressive, don't do it.
   * Eg, it will do brandy->brand.
   */
  log('Merging all 6+-prefix sharers\' stem groups...');
  const sortedLexicon = new Array(exetLexicon.lexicon.length);
  for (let i = 0; i < exetLexicon.lexicon.length; i++) {
    sortedLexicon[i] = i;
  }
  sortedLexicon.sort((a, b) => exetLexicon.lexicon[a].localeCompare(exetLexicon.lexicon[b]));
  let start = 0;
  let prefixIdx = sortedLexicon[start];
  let prefix = exetLexicon.lexicon[prefixIdx];
  let prefixUpper = prefix.toUpperCase();
  for (let i = 1; i < sortedLexicon.length; i++) {
    const idx = sortedLexicon[i];
    const entry = exetLexicon.lexicon[idx];
    const entryUpper = entry.toUpperCase();
    if (prefix.length >= 6 && entryUpper.startsWith(prefixUpper)) {
      // mergeCycles(prefixIdx, idx, 'Because [' + prefix + '] extends to [' + entry + ']');
      mergeCycles(prefixIdx, idx);
    } else {
      prefixIdx = idx;
      prefix = entry;
      prefixUpper = entryUpper;
    }
  }

  log('Merging for some suffixes missed by the stemming algo...');
  /**
   * Supplement the stemming algo as it seems to miss these suffixes.
   * Only use suffixes that are preceded by entire words without
   * any mutations and are at least of length 4. (Note that lengths
   * 6 and above will already be covered by the previous block of code).
   * Keep sorted by non-increasing length.
   */
  const commonSuffixes = [
    'aholics',
    'aholic',
    'ships',
    'less',
    'like',
    'ship',
    'some',
    'ward',
    'wise',
  ];
  /**
   * Dealing with common prefixes like non-, un- is tempting but
   * don't do it: it leads to LOTS of false positive mergers.
   */
  for (let idx = 0; idx < exetLexicon.lexicon.length; idx++) {
    const w = exetLexicon.lexicon[idx];
    for (const suff of commonSuffixes) {
      if (w.endsWith(suff)) {
        const pref = w.substr(0, w.length - suff.length);
        if (pref.length < 4) continue;
        if (pref.indexOf(' ') >= 0) continue;
        if (pref.indexOf('-') >= 0) continue;
        if (pref.indexOf("'") >= 0) continue;
        const inLex = exetLexicon.getLexChoices(pref.toUpperCase(), 1);
        if (inLex.length == 1) {
          mergeCycles(idx, inLex[0], 'Because [' + w + '] has suffix [' + suff + ']');
          break;
        }
      }
    }
  }

  log('Post-mergers, re-testing that every lexicon index returns a valid cycle');
  longestCycle = 0;
  for (let i = 0; i < n; i++) {
    const cycle = getCycle(i);
    console.assert(cycle.length >= 1, i);
    if (cycle.length > longestCycle) {
      longestCycle = cycle.length;
      log('longest cycle ' + printCycle(cycle) + ': ' + longestCycle, true);
    }
  }

  log('Creating regional swap-lists...');
  const regions = makeRegionalSwapLists(regionalVariants);
  exetLexicon.regions = {};
  for (const r in regions) {
    exetLexicon.regions[r] = {
      swaps: regions[r].swaps,
      dontBanish: regions[r].dontBanish
    };
  }

  log('Writing ' + lexStemsFile);
  let stemsText = `exetLexicon = {...((typeof exetLexicon == "object" && exetLexicon) ? exetLexicon : {}), ...JSON.parse(\`{
  "stemsId": "${exetLexicon.id}",
  "stems": [
    `;

  for (let i = 0; i < n; i++) {
    if (i > 0) {
      stemsText += ',';
      if ((i % 10) == 0) {
        stemsText += "\n    ";
      }
    }
    stemsText += '' + stemGroups[i];
  }
  stemsText += `
  ],`;

  stemsText += `
  "regions": {`;
  const rlist = Object.keys(exetLexicon.regions);
  for (let x = 0; x < rlist.length; x++) {
    const region = rlist[x];
    if (x > 0) stemsText += ',';
    stemsText += `
    "${region}":  {
      "swaps": [
        `;
    for (let y = 0; y < exetLexicon.regions[region].swaps.length; y++) {
      if (y > 0) {
        stemsText += ',';
        if ((y % 10) == 0) {
          stemsText += "\n        ";
        }
      }
      const pair = exetLexicon.regions[region].swaps[y];
      stemsText += '[' + pair[0] + ',' + pair[1] + ']';
    }
    stemsText += `
      ],
      "dontBanish": [
        `;
    let y = 0;
    for (const keepIdx of exetLexicon.regions[region].dontBanish) {
      if (y > 0) {
        stemsText += ',';
        if ((y % 10) == 0) {
          stemsText += "\n        ";
        }
      }
      stemsText += '' + keepIdx;
      y++;
    }
    stemsText += `
      ]}`;
  }
  stemsText += `
  }`;

  stemsText += `
}\`)};`;

  // stemsText += '\n' + getVariants();

  save(stemsText, lexStemsFile);

  log('Done!');
}
